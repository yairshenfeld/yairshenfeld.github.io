<header class="site-header" role="banner">
  <div class="wrapper">
    <a class="site-title{% if page.header_decoration == 'wave' %} has-wave{% endif %}" rel="author" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="primary-nav" aria-label="Main navigation">
      <input type="checkbox" id="nav-toggle" class="nav-toggle" aria-controls="nav-links">
      <label for="nav-toggle" class="nav-toggle-label">
        <span class="visually-hidden">Toggle navigation</span>
        <svg viewBox="0 0 18 15" width="18" height="15" aria-hidden="true" focusable="false">
          <path d="M0 1.5h18M0 7.5h18M0 13.5h18" stroke="currentColor" stroke-width="3"/>
        </svg>
      </label>
      <div id="nav-links" class="nav-links">
        {% for item in site.navigation %}
          <a class="nav-link{% if item.decoration == 'wave' %} has-wave{% endif %}" href="{{ item.url | relative_url }}"{% if page.url == item.url %} aria-current="page"{% endif %}>{{ item.title | escape }}</a>
        {% endfor %}
      </div>
    </nav>
  </div>
</header>
