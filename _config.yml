title: Yair Shenfeld
description: Yair Shenfeld, Assistant Professor of Applied Mathematics at Brown University.
author:
  name: Yair Shenfeld
lang: en
baseurl: ""
url: "https://yairshenfeld.com"

# Minima supplies the base CSS. Local layouts and includes control the markup.
theme: minima
plugins:
  - jekyll-seo-tag

include:
  - _pages
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - scripts
  - vendor
  - .DS_Store

# Pages can override the shared layout in their own front matter.
defaults:
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: default

navigation:
  - title: Home
    url: /
  - title: Papers
    url: /papers/
  - title: Flows
    url: /flows/
    decoration: wave
  - title: Talks
    url: /talks/
