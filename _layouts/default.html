<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' | escape }}">
  {% include head.html %}
  <body class="{{ page.class | default: '' | escape }}">
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include header.html %}
    <main id="main-content" class="page-content" aria-label="Content" tabindex="-1">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>
  </body>
</html>
